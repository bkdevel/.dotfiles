format = """
[](#671214)\
$username\
[](bg:#892628 fg:#671214)\
$directory\
[](fg:#892628 bg:#bf6a6c)\
$git_branch\
$git_status\
[](fg:#bf6a6c bg:#ee686a)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#ee686a bg:#fa4245)\
$docker_context\
[](fg:#fa4245 bg:#f93a3d)\
$time\
[ ](fg:#f93a3d)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#671214"
style_root = "bg:#671214"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E"
disabled = false # Disabled by default

[directory]
style = "bg:#892628"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#ee686a"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#ee686a"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#ee686a"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#f93a3d"
format = '[ ♥ $time ]($style)'
